name: lint

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh bootstrap.sh
      - name: Zsh syntax
        run: |
          sudo apt-get install -yq zsh
          zsh -n zshrc zprofile aliases
